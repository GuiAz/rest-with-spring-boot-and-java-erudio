name: Continuos Integration and Delivery with Github Actions

on:
  push:
    branches:
      - "main"
jobs:

  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build Application JAR
        working-directory: ./rest-with-spring-boot-and-java-erudio
        run: mvn clean package -DskipTests

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./rest-with-spring-boot-and-java-erudio
          push: true
          tags: guiaz/rest-with-spring-boot-and-java-erudio:latest